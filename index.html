<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>לחיות את הת״ש</title>
<meta name="description" content="זכויות ת״ש לחיילי חובה וקבע, ואיך מוציאים כל אישור מהבנק">
<meta name="theme-color" content="#ffffff">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Heebo:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="icon" href="assets/logo.png">
<link rel="apple-touch-icon" href="assets/logo.png">
<style>
:root{
  --bg:#ffffff;
  --surface:#f5f7f5;
  --line:rgba(18,32,24,.09);
  --line-strong:rgba(18,32,24,.16);
  --text:#15201a;
  --text-2:#4a5850;
  --text-3:#7b8780;
  --green:#0e5a34;          /* ירוק בקבוק – צבע מוביל */
  --green-ink:#0b4a2b;
  --green-soft:#e8f1ec;
  --emblem:#109a3c;         /* ירוק הסמל */
  --purple:#5b2d8a;         /* השרוך */
  --purple-2:#7a49ad;
  --radius:12px;
  --ease:cubic-bezier(.2,.7,.2,1);
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{
  margin:0;background:var(--bg);color:var(--text);
  font-family:"Heebo",system-ui,-apple-system,"Segoe UI",Arial,sans-serif;
  font-size:16px;line-height:1.6;font-variant-numeric:tabular-nums;
  -webkit-font-smoothing:antialiased;
}
a{color:var(--green)}
button{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--green);outline-offset:2px;border-radius:6px}

/* ---------- השרוך ---------- */
.cord{
  height:6px;
  background:repeating-linear-gradient(135deg,var(--purple) 0 6px,var(--purple-2) 6px 9px);
}

/* ---------- מבנה ---------- */
.wrap{max-width:720px;margin:0 auto;padding:0 16px}
header.top{
  position:sticky;top:0;z-index:10;background:rgba(255,255,255,.94);
  backdrop-filter:saturate(1.2) blur(8px);-webkit-backdrop-filter:saturate(1.2) blur(8px);
  border-bottom:1px solid var(--line);
}
.bar{display:flex;align-items:center;gap:12px;height:56px}
.brand{display:flex;align-items:center;gap:12px;text-decoration:none;color:var(--text);font-weight:500;font-size:16px}
.brand img{width:32px;height:32px;flex:none;object-fit:contain}
.back{
  margin-inline-start:auto;display:none;align-items:center;gap:4px;
  border:0;background:none;padding:8px 12px;margin-inline-end:-12px;border-radius:8px;cursor:pointer;
  color:var(--text-2);font-size:16px;transition:background-color .15s var(--ease)
}
.back:hover{background:var(--surface)}
.back svg{width:18px;height:18px}
body.inner .back{display:inline-flex}

main{padding:24px 0 48px;min-height:70vh}
.view{animation:enter .22s var(--ease)}
@keyframes enter{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion:reduce){.view{animation:none}}

/* ---------- בית ---------- */
.hero{display:grid;grid-template-columns:1fr auto;gap:16px;align-items:center;padding:8px 0 28px}
.hero h1{font-size:32px;line-height:1.15;font-weight:600;margin:0 0 8px;letter-spacing:-.01em}
.hero p{margin:0;color:var(--text-2);font-size:16px;max-width:30ch}
.hero .mark{width:96px;height:96px}
.hero .mark{object-fit:contain}

.eyebrow{margin:0 0 4px !important;font-size:14px !important;color:var(--text-3) !important}
.quick{display:flex;flex-wrap:wrap;gap:8px;margin:0 0 16px}
.quick a{padding:8px 12px;border-radius:8px;background:var(--surface);color:var(--text-2);font-size:14px;text-decoration:none;transition:background-color .15s var(--ease)}
.quick a:hover{background:#e9ede9}
.folder{display:flex;flex-direction:column;gap:12px;padding:20px;margin:0 0 8px;border-radius:16px;background:var(--green);color:#fff;text-decoration:none}
.folder .f-top{display:flex;align-items:center;justify-content:space-between;gap:12px}
.folder .f-top > span{display:flex;flex-direction:column;gap:4px}
.folder .f-label{font-size:14px;color:rgba(255,255,255,.75)}
.folder b{font-size:20px;font-weight:600}
.folder .f-num{font-size:28px;font-weight:600}
.folder .f-bar{height:6px;border-radius:4px;background:rgba(255,255,255,.2);overflow:hidden}
.folder .f-bar i{display:block;height:100%;background:#fff;border-radius:4px}
.folder .f-next{font-size:14px;color:rgba(255,255,255,.88);line-height:1.45;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.clear-all{display:block;margin:0 0 16px auto;border:0;background:none;padding:8px 4px;font:inherit;font-size:14px;color:var(--text-3);cursor:pointer;text-decoration:underline;text-underline-offset:3px}
.clear-all:hover{color:var(--text-2)}
.ch-end{display:flex;align-items:center;gap:12px}
.check .clear{border:0;background:none;padding:4px;font:inherit;font-size:14px;color:var(--text-3);cursor:pointer;text-decoration:underline;text-underline-offset:3px}
.check .clear:hover{color:var(--text-2)}
.h-tabs{margin:0 0 16px}
.h-tabs::-webkit-scrollbar{display:none}
.h-tabs a{flex:none;border:1px solid var(--line-strong);background:#fff;border-radius:8px;padding:8px 12px;font-size:14px;color:var(--text-2);text-decoration:none;white-space:nowrap;transition:background-color .15s var(--ease),color .15s var(--ease)}
.h-tabs a[aria-pressed="true"]{background:var(--green);border-color:var(--green);color:#fff}
.h-note{margin:0 0 16px;padding:12px 16px;border-radius:8px;background:#fbf6e9;color:#6b5414;font-size:14px;line-height:1.55}
.h-next{display:flex;flex-direction:column;gap:4px;padding:16px;margin:0 0 8px;border-radius:12px;background:var(--green-soft)}
.h-next-l{font-size:14px;color:var(--green)}
.h-next b{font-size:20px;font-weight:600}
.h-next > span:not(.tag):not(.h-next-l){font-size:14px;color:var(--text-2)}
.h-month{margin:24px 0 8px;font-size:14px;font-weight:500;color:var(--text-3)}
.h-row{display:flex;gap:12px;align-items:flex-start;padding:12px 0;border-top:1px solid var(--line)}
.h-row.past{opacity:.5}
.h-row.is-next .h-day{background:var(--green);color:#fff}
.h-row.is-next .h-day span{color:rgba(255,255,255,.8)}
.h-day{flex:none;width:48px;height:48px;border-radius:12px;background:var(--surface);display:flex;flex-direction:column;align-items:center;justify-content:center;line-height:1.1}
.h-day b{font-size:20px;font-weight:600}
.h-day span{font-size:12px;color:var(--text-3)}
.h-t{display:flex;flex-direction:column;gap:4px;min-width:0}
.h-t b{font-weight:500}
.h-t > span:not(.tag){font-size:14px;color:var(--text-3)}
.tag{display:inline-flex;align-items:center;gap:8px;font-size:14px;color:var(--text-2);line-height:1.4}
.tag::before{content:"";flex:none;width:8px;height:8px;border-radius:50%;background:currentColor}
.tag.ok::before{background:#1f8a4c}.tag.take::before{background:#c27a12}.tag.half::before{background:#e0b25a}.tag.fast::before{background:#8a948e}
.h-rules{margin-top:24px}
.h-rules .content{padding:4px 16px 8px}
.doc-link{margin:24px 0 0}
.doc-note{margin:0 0 16px;font-size:14px;color:var(--text-3)}
.pages{display:flex;flex-direction:column;gap:12px}
.pages img{display:block;width:100%;height:auto;border:1px solid var(--line);border-radius:8px;background:#fff}
.upd{margin:-12px 0 20px;font-size:14px;color:var(--text-3)}
.section-label.grp{margin:24px 0 8px}
.section-label.grp:first-of-type{margin-top:0}
.list .row.sub-row{padding-inline-start:32px}
.summary{margin:0 0 24px;border:1px solid var(--line);border-radius:12px;overflow:hidden}
.sm-row{display:grid;grid-template-columns:96px 1fr;gap:12px;padding:12px 16px;border-top:1px solid var(--line)}
.sm-row:first-child{border-top:0}
.sm-row dt{font-size:14px;color:var(--text-3);font-weight:500}
.sm-row dd{margin:0;font-size:16px;line-height:1.5}
.section-label{font-size:14px;color:var(--text-3);margin:0 0 8px;font-weight:500}

.list{list-style:none;margin:0;padding:0;border:1px solid var(--line);border-radius:var(--radius);overflow:hidden}
.list li+li{border-top:1px solid var(--line)}
.row{
  display:flex;align-items:center;gap:12px;width:100%;min-height:56px;padding:12px 16px;
  text-decoration:none;color:var(--text);background:var(--bg);border:0;text-align:start;cursor:pointer;
  transition:background-color .15s var(--ease)
}
.row:hover{background:var(--surface)}
.row:active{background:#edf1ee}
.row .t{flex:1;min-width:0}
.row .t b{display:block;font-weight:500;font-size:16px}
.row .t span{display:block;color:var(--text-3);font-size:14px;line-height:1.4;margin-top:2px}
.row .n{color:var(--text-3);font-size:14px}
.row .chev{width:16px;height:16px;color:var(--text-3);flex:none}
.big .row{min-height:72px;padding:16px}
.big .row .t b{font-size:16px}
.ico{width:36px;height:36px;border-radius:8px;background:var(--green-soft);color:var(--green);display:grid;place-items:center;flex:none}
.ico svg{width:18px;height:18px}

.note{margin-top:24px;padding:16px;border-radius:var(--radius);background:var(--surface);color:var(--text-2);font-size:14px;line-height:1.55}

/* ---------- שפות ---------- */
.langs{display:flex;flex-wrap:wrap;gap:6px;margin:4px 0 16px}
.langs button{border:1px solid var(--line-strong);background:#fff;border-radius:8px;padding:6px 12px;font-size:14px;cursor:pointer;color:var(--text-2);transition:background-color .15s var(--ease),color .15s var(--ease),border-color .15s var(--ease)}
.langs button:hover{background:var(--surface)}
.langs button[aria-pressed="true"]{background:var(--green);border-color:var(--green);color:#fff}
.content[dir="ltr"]{text-align:left}

/* ---------- חיפוש ---------- */
.search{display:flex;align-items:center;gap:12px;height:48px;padding:0 16px;margin:0 0 16px;border:1px solid var(--line-strong);border-radius:var(--radius);background:#fff;transition:border-color .15s var(--ease)}
.search:focus-within{border-color:var(--green)}
.search svg{width:18px;height:18px;color:var(--text-3);flex:none}
.search input{flex:1;min-width:0;border:0;outline:0;background:none;font:inherit;font-size:16px;color:var(--text)}
.search input::placeholder{color:var(--text-3)}
mark{background:var(--green-soft);color:var(--green-ink);border-radius:3px;padding:0 1px}

/* ---------- דף נושא ---------- */
.crumb{font-size:14px;color:var(--text-3);margin:0 0 4px}
.page-title{font-size:28px;line-height:1.2;font-weight:600;margin:0 0 20px}
.content{font-size:16px}
.content h2{font-size:20px;font-weight:600;margin:32px 0 8px;padding-top:24px;border-top:1px solid var(--line);color:var(--text)}
.content > h2:first-child{margin-top:0;padding-top:0;border-top:0}
.content h3{font-size:16px;font-weight:600;margin:20px 0 6px;color:var(--green-ink)}
.content p{margin:0 0 12px}
.content strong{font-weight:600}
.content ol{margin:0 0 12px;padding-inline-start:24px}
.content li{margin:4px 0;padding-inline-start:2px}
.content li::marker{color:var(--text-3)}
.content ul{margin:0 0 12px;padding-inline-start:20px}
.content ul li::marker{color:var(--green)}
.content .tbl{overflow-x:auto;margin:8px 0 16px;border:1px solid var(--line);border-radius:var(--radius)}
.content table{border-collapse:collapse;width:100%;font-size:14px;line-height:1.45}
.content th{background:var(--surface);font-weight:500;color:var(--text-2);text-align:start;padding:12px;white-space:nowrap}
.content td{padding:12px;border-top:1px solid var(--line);vertical-align:top}
.content td:first-child{min-width:120px}
.content td.num{white-space:nowrap}
.content .callout{margin:16px 0;padding:12px 16px;border-radius:8px;background:#fbf6e9;color:#6b5414;font-size:14px;line-height:1.55}
.sub-title{font-size:20px;font-weight:600;margin:32px 0 12px}
.content a.ext{display:inline-flex;align-items:center;gap:6px;font-weight:500;text-decoration:none;padding:12px 16px;border-radius:8px;background:var(--green);color:#fff}

/* רשימת אישורים עם סימון */
.check{border:1px solid var(--line);border-radius:var(--radius);margin:8px 0 16px;overflow:hidden}
.check-head{display:flex;justify-content:space-between;align-items:center;padding:12px 16px;background:var(--surface);font-size:14px;color:var(--text-2)}
.check-head .count{color:var(--green);font-weight:500}
.check ul{list-style:none;margin:0;padding:0}
.check li{margin:0;padding:0;border-top:1px solid var(--line)}
.check label{display:flex;gap:12px;align-items:flex-start;padding:12px 16px;cursor:pointer;line-height:1.5}
.check input{appearance:none;-webkit-appearance:none;flex:none;width:20px;height:20px;margin:2px 0 0;border:1.5px solid var(--line-strong);border-radius:6px;background:#fff;display:grid;place-items:center;cursor:pointer;transition:background-color .15s var(--ease),border-color .15s var(--ease)}
.check input::after{content:"";width:10px;height:5px;border-left:2px solid #fff;border-bottom:2px solid #fff;transform:translateY(-1px) rotate(-45deg);opacity:0}
.check input:checked{background:var(--green);border-color:var(--green)}
.check input:checked::after{opacity:1}
.check input:checked + span{color:var(--text-3);text-decoration:line-through;text-decoration-color:rgba(18,32,24,.3)}
.check .bar-p{height:3px;background:var(--line)}
.check .bar-p i{display:block;height:100%;width:0;background:var(--green);transition:width .25s var(--ease)}

/* ---------- בנקים ---------- */
.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}
.tile{
  display:flex;align-items:center;gap:12px;min-height:56px;padding:12px 16px;border:1px solid var(--line);border-radius:var(--radius);
  background:var(--bg);text-decoration:none;color:var(--text);font-weight:500;transition:background-color .15s var(--ease),border-color .15s var(--ease)
}
.tile:hover{background:var(--surface);border-color:var(--line-strong)}
.tile .ini{display:none;width:28px;height:28px;border-radius:8px;background:var(--surface);color:var(--text-2);display:grid;place-items:center;font-size:14px;flex:none}
.tile:hover .ini{background:#fff}

.seg{display:inline-flex;padding:4px;border-radius:12px;background:var(--surface);border:1px solid var(--line);margin:0 0 20px}
.seg button{border:0;background:none;padding:8px 16px;border-radius:8px;cursor:pointer;color:var(--text-2);display:inline-flex;align-items:center;gap:6px;font-size:16px;transition:background-color .15s var(--ease),color .15s var(--ease)}
.seg button svg{width:16px;height:16px}
.seg button[aria-pressed="true"]{background:#fff;color:var(--text);box-shadow:0 1px 2px rgba(18,32,24,.08),0 0 0 1px var(--line)}

.docs{display:grid;gap:12px}
.doc{border:1px solid var(--line);border-radius:var(--radius);overflow:hidden}
.doc summary{list-style:none;display:flex;align-items:center;gap:12px;padding:16px;cursor:pointer;font-weight:500}
.doc summary::-webkit-details-marker{display:none}
.doc summary .n{margin-inline-start:auto;color:var(--text-3);font-weight:400;font-size:14px}
.doc summary .chev{width:16px;height:16px;color:var(--text-3);transition:transform .2s var(--ease)}
.doc[open] summary .chev{transform:rotate(-90deg)}
.doc[open] summary{border-bottom:1px solid var(--line)}
.steps{list-style:none;margin:0;padding:8px 16px 16px;counter-reset:s}
.steps li{counter-increment:s;display:flex;gap:12px;padding:8px 0;line-height:1.5}
.steps li::before{content:counter(s);flex:none;width:24px;height:24px;border-radius:50%;background:var(--green-soft);color:var(--green);font-size:14px;font-weight:500;display:grid;place-items:center;margin-top:1px}
.alias{padding:16px;border-radius:var(--radius);background:var(--green-soft);color:var(--green-ink);margin:0 0 20px;font-size:16px}

/* ---------- קבע ---------- */
.chips{display:flex;flex-wrap:wrap;gap:8px;margin:0 0 24px;padding:0;list-style:none}
.chips li{padding:8px 12px;border:1px solid var(--line);border-radius:8px;font-size:16px}
.how{list-style:none;margin:0 0 20px;padding:0;display:grid;grid-template-columns:1fr 1fr;gap:8px;counter-reset:h}
.how li{counter-increment:h;display:flex;gap:12px;align-items:center;padding:12px;border-radius:8px;background:var(--surface);font-size:14px;line-height:1.4;color:var(--text-2)}
.how li::before{content:counter(h);flex:none;width:22px;height:22px;border-radius:50%;background:var(--green);color:#fff;font-size:12px;font-weight:500;display:grid;place-items:center}

footer{border-top:1px solid var(--line);padding:20px 0 32px;color:var(--text-3);font-size:14px;line-height:1.6}

@media (max-width:420px){
  .hero .mark{width:64px;height:64px}
  .hero h1{font-size:28px}
  .grid{grid-template-columns:1fr 1fr}
  .page-title{font-size:24px}
}
</style>
</head>
<body>
<div class="cord" aria-hidden="true"></div>
<header class="top">
  <div class="wrap bar">
    <a class="brand" href="#/" aria-label="לחיות את הת״ש – דף הבית">
      <img src="assets/logo.png" alt="" width="32" height="32">
      <span>לחיות את הת״ש</span>
    </a>
    <button class="back" id="back" type="button">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><path d="M9 6l6 6-6 6"/></svg>
      חזרה
    </button>
  </div>
</header>

<main class="wrap"><div id="app"></div></main>

<footer class="wrap">
  המידע כללי ומבוסס על הנחיות 2026. סכומים וכללים עשויים להשתנות, ובכל שאלה כדאי לפנות לגורמי הת״ש ביחידה.
</footer>

<!-- סמל: פלר דה ליס בעיצוב מקורי, חצי ירוק וחצי לבן -->
<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <defs>
    <path id="lily-half" d="M50 6 C57 16 62 26 61 37 C60 45 57 51 54 56 L57 56 C58 44 66 33 77 32 C87 31 92 40 89 48 C87 54 81 57 77 54 C74 52 75 47 79 46 C82 45 83 42 80 40 C75 37 68 44 66 56 L71 56 C73 56 74 57 74 59 L74 62 C74 64 73 65 71 65 L56 65 C58 71 63 77 70 80 C64 82 57 80 53 76 L50 74 Z"/>
    <g id="lily"><g transform="translate(50 51) scale(.96) translate(-50 -43)"><use href="#lily-half"/><use href="#lily-half" transform="translate(100 0) scale(-1 1)"/></g></g>
    <clipPath id="c-r"><rect x="50" y="0" width="50" height="100"/></clipPath>
    <clipPath id="c-l"><rect x="0" y="0" width="50" height="100"/></clipPath>
    <g id="emblem">
      <circle cx="50" cy="50" r="48" fill="#fff"/>
      <g clip-path="url(#c-r)"><circle cx="50" cy="50" r="48" fill="#109a3c"/><use href="#lily" fill="#fff"/></g>
      <g clip-path="url(#c-l)"><use href="#lily" fill="#109a3c"/></g>
      <circle cx="50" cy="50" r="47.5" fill="none" stroke="#109a3c" stroke-width="1.5"/>
    </g>
  </defs>
</svg>

<script src="data.js"></script>
<script>
(function(){
  const D = window.TASH;
  const app = document.getElementById('app');
  const back = document.getElementById('back');

  const chev = '<svg class="chev" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><path d="M15 6l-6 6 6 6"/></svg>';
  const icons = {
    hova:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3l7 3v5c0 4.5-3 8-7 10-4-2-7-5.5-7-10V6z"/></svg>',
    banks:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M3 10h18L12 4z"/><path d="M5 10v8M9.5 10v8M14.5 10v8M19 10v8M3 20h18"/></svg>',
    keva:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="7" width="18" height="13" rx="2"/><path d="M9 7V5a2 2 0 0 1 2-2h2a2 2 0 0 1 2 2v2M3 12h18"/></svg>',
    cal:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="5" width="18" height="16" rx="2"/><path d="M3 10h18M8 3v4M16 3v4"/></svg>',
    pc:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="12" rx="2"/><path d="M8 20h8M12 16v4"/></svg>',

  };

  const store = {
    get(k){ try{ return JSON.parse(localStorage.getItem(k)); }catch(e){ return null; } },
    set(k,v){ try{ localStorage.setItem(k, JSON.stringify(v)); }catch(e){} }
  };
  const esc = s => String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

  function render(html, inner){
    document.body.classList.toggle('inner', !!inner);
    app.innerHTML = '<div class="view">' + html + '</div>';
    window.scrollTo(0,0);
  }

  /* ---------- בית ---------- */
  function home(){
    render(`
      <section class="hero">
        <div>
          <p class="eyebrow">מדריך זכויות ת״ש · 2026</p>

      </section>
      <label class="search">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="M20 20l-4-4"/></svg>
        <input id="q" type="search" placeholder="חיפוש" autocomplete="off" aria-label="חיפוש">
      </label>
      <div id="results" hidden></div>
      <div id="homeMain">
      <div class="quick">${quickLinks()}</div>
      ${folderCard()}
      <ul class="list big">
        <li><a class="row" href="#/hova"><span class="ico">${icons.hova}</span><span class="t"><b>ת״ש חובה</b><span>חופשות, היתר עבודה, חייל בודד, תשמ״ש ועוד</span></span><span class="n">${D.hova.length}</span>${chev}</a></li>
        <li><a class="row" href="#/banks"><span class="ico">${icons.banks}</span><span class="t"><b>אישורים לפי בנק</b><span>עובר ושב, ריכוז יתרות, פירוט אשראי ובעלות חשבון</span></span><span class="n">${D.banks.length}</span>${chev}</a></li>
        <li><a class="row" href="#/keva"><span class="ico">${icons.keva}</span><span class="t"><b>ת״ש קבע</b><span>שכר דירה, גנים, ליווי כלכלי ובקשות בדיגיטל</span></span><span class="n">${D.keva.topics.length}</span>${chev}</a></li>
        <li><a class="row" href="#/holidays"><span class="ico">${icons.cal}</span><span class="t"><b>חגים ומועדים ${D.holidays.year}</b><span>לכל העדות, ומה יורד מהחופשה</span></span>${chev}</a></li>
      </ul>
      <div class="note">כדי לפתוח בקשה, פנו למשקית הת״ש ביחידה (במשרתי קבע: לקצינת הת״ש) או היכנסו למערכת ת״ש בטאץ׳.</div>
      </div>
    `);
    const ca = document.getElementById('clearAll');
    if(ca) ca.addEventListener('click', () => {
      if(!confirm('לנקות את כל הסימונים בכל הנושאים? אי אפשר לבטל את זה.')) return;
      try { Object.keys(localStorage).filter(k => k === 'lastChk' || k.startsWith('chk:')).forEach(k => localStorage.removeItem(k)); } catch(e) {}
      home();
    });
    const q = document.getElementById('q');
    q.addEventListener('input', () => search(q.value));
    if(lastQuery){ q.value = lastQuery; search(lastQuery); }
  }

  function quickLinks(){
    const find = (list, title, base) => { const i = list.findIndex(t => t.title === title); return i < 0 ? null : base + i; };
    return [
      ['שכר דירה', find(D.keva.topics, 'שכר דירה', '#/keva/')],
      ['חופשות מיוחדות', find(D.hova, 'חופשות מיוחדות', '#/hova/')],
      ['חייל בודד', find(D.hova, 'חייל בודד', '#/hova/')],
      ['תשמ״ש', find(D.hova, 'תשמ״ש – תשלומי משפחה', '#/hova/')],
    ].filter(x => x[1]).map(([n,h]) => `<a href="${h}">${n}</a>`).join('');
  }

  // כרטיס "התיק שלך": הנושא האחרון שבו סימנת מסמכים
  function folderCard(){
    const key = store.get('lastChk'); if(!key) return '';
    const m = /^chk:(k?)(\d+)$/.exec(key); if(!m) return '';
    const t = (m[1] ? D.keva.topics : D.hova)[+m[2]]; if(!t) return '';
    const saved = store.get(key) || {};
    const el = document.createElement('div'); el.innerHTML = t.html;
    const items = []; let id = 0;
    el.querySelectorAll('h3').forEach(h => {
      if(!/^אישורים נדרשים/.test(h.textContent.trim())) return;
      const ol = h.nextElementSibling; if(!ol || ol.tagName !== 'OL') return;
      [...ol.children].forEach((li, j) => items.push({text: li.textContent.trim(), done: !!saved[id + '.' + j]}));
      id++;
    });
    if(!items.length) return '';
    const done = items.filter(x => x.done).length;
    const next = items.find(x => !x.done);
    const href = (m[1] ? '#/keva/' : '#/hova/') + m[2];
    return `<a class="folder" href="${href}">
      <span class="f-top"><span><span class="f-label">התיק שלך</span><b>${esc(t.title)}</b></span><span class="f-num">${done}/${items.length}</span></span>
      <span class="f-bar"><i style="width:${done / items.length * 100}%"></i></span>
      <span class="f-next">${next ? 'הבא ברשימה: ' + esc(next.text) : 'יש לך את כל המסמכים'}</span>
    </a><button type="button" class="clear-all" id="clearAll">ניקוי כל הסימונים</button>`;
  }

  /* ---------- חיפוש ---------- */
  let lastQuery = '';
  let INDEX = null;
  const norm = s => String(s).toLowerCase().replace(/[״"׳'֑-ׇ]/g, '').replace(/[-–־]/g, ' ').replace(/\s+/g, ' ');
  const plain = html => { const el = document.createElement('div'); el.innerHTML = html.replace(/<\/(p|li|h2|h3|td|th|tr|strong)>/g, '$& '); return el.textContent.replace(/\s+/g, ' ').trim(); };
  // אותיות סופיות נחשבות כרגילות, ומילה ברבים מחפשת גם את השורש: גנים → גנ
  const FINALS = {'ך':'כ','ם':'מ','ן':'נ','ף':'פ','ץ':'צ'};
  const fold = s => s.replace(/[ךםןףץ]/g, c => FINALS[c]);
  const variants = w => (w.length > 3 && /(ימ|ות)$/.test(w)) ? [w, w.slice(0,-2)] : [w];
  const has = (str, w) => variants(w).some(v => str.includes(v));
  function buildIndex(){
    const items = [];
    D.hova.forEach((t,i) => items.push({where:'ת״ש חובה', title:t.title, href:'#/hova/'+i, text:plain(t.html) + (t.langs ? ' ' + Object.values(t.langs).map(l => l.title + ' ' + plain(l.html)).join(' ') : '')}));
    D.keva.topics.forEach((t,i) => items.push({where:'ת״ש קבע', title:t.title, href:'#/keva/'+i, text:t.sub + ' · ' + plain(t.html)}));
    D.keva.online.forEach(o => items.push({where:'טופס דיגיטלי לקבע', title:o.title, href:o.link, ext:true, text:''}));
    D.holidays.communities.forEach(c => c.items.forEach(h => items.push({where:'חגים ומועדים · ' + c.name, title:h.name, href:'#/holidays/' + c.id, text:dateLabel(h.date)})));
    D.banks.forEach((b,i) => items.push({where:'אישורים לפי בנק', title:b.name, href:'#/banks/'+i, text:'עובר ושב ריכוז יתרות פירוט אשראי אישור בעלות חשבון'}));
    items.forEach(it => { it.nt = fold(norm(it.title)); it.nx = fold(norm(it.text)); });
    return items;
  }
  function snippet(text, words){
    const n = fold(text.toLowerCase());
    let at = -1;
    for(const w of words){ at = n.indexOf(w); if(at >= 0) break; }
    if(at < 0) return '';
    // norm() keeps length for most text, so the index maps back closely enough for a preview
    const start = Math.max(0, at - 40);
    let s = text.slice(start, start + 140);
    if(start > 0) s = '…' + s.replace(/^\S*\s/, '');
    if(start + 140 < text.length) s = s.replace(/\s\S*$/, '') + '…';
    return s;
  }
  function mark(s, words){
    let out = esc(s);
    const UNFOLD = {'כ':'[כך]','מ':'[מם]','נ':'[נן]','פ':'[פף]','צ':'[צץ]'};
    words.forEach(w => {
      if(w.length < 2) return;
      const re = w.replace(/[.*+?^${}()|[\]\\]/g, '\\$&').replace(/[כמנפצ]/g, c => UNFOLD[c]);
      out = out.replace(new RegExp('(' + re + ')', 'g'), '<mark>$1</mark>');
    });
    return out;
  }
  function search(raw){
    lastQuery = raw;
    const res = document.getElementById('results'), main = document.getElementById('homeMain');
    const words = fold(norm(raw)).trim().split(' ').filter(Boolean);
    if(!words.length){ res.hidden = true; main.hidden = false; return; }
    INDEX = INDEX || buildIndex();
    const hits = INDEX.map(it => {
      if(!words.every(w => has(it.nt, w) || has(it.nx, w))) return null;
      const score = words.filter(w => has(it.nt, w)).length * 10 + (it.ext ? -1 : 0);
      return {it, score};
    }).filter(Boolean).sort((a,b) => b.score - a.score).slice(0, 30);
    main.hidden = true; res.hidden = false;
    res.innerHTML = hits.length
      ? `<p class="section-label">${hits.length} תוצאות</p><ul class="list">${hits.map(({it}) => {
          const all = words.flatMap(variants);
          const snip = it.text && !words.every(w => has(it.nt, w)) ? snippet(it.text, all) : '';
          return `<li><a class="row" href="${esc(it.href)}"${it.ext ? ' target="_blank" rel="noopener"' : ''}><span class="t"><b>${mark(it.title, all)}</b><span>${esc(it.where)}${snip ? ' · ' + mark(snip, all) : ''}</span></span>${it.ext ? extIcon : chev}</a></li>`;
        }).join('')}</ul>`
      : `<div class="note">לא מצאנו תוצאות. נסו מילה אחרת, או פנו לגורמי הת״ש ביחידה.</div>`;
  }

  /* ---------- ת״ש חובה ---------- */
  function hovaList(){
    render(`
      <p class="crumb">ת״ש חובה</p>
      <h1 class="page-title">על מה תרצו לקרוא?</h1>
      <ul class="list">
        ${D.hova.map((t,i)=>({t,i,pos:t.pos ?? i})).sort((a,b)=>a.pos-b.pos).map(({t,i})=>`<li><a class="row${t.pos != null ? ' sub-row' : ''}" href="#/hova/${i}"><span class="t"><b>${esc(t.title)}</b>${t.sub ? `<span>${esc(t.sub)}</span>` : ''}</span>${chev}</a></li>`).join('')}
      </ul>
    `, true);
  }

  function hovaTopic(i){
    const t = D.hova[i]; if(!t) return go('#/hova');
    const langs = t.langs ? Object.keys(t.langs) : [];
    const bar = langs.length ? `<div class="langs" role="group" aria-label="שפה">${
      [['he','עברית']].concat(langs.map(k => [k, LANG_NAMES[k]])).map(([k,n]) => `<button type="button" data-l="${k}" lang="${k}">${n}</button>`).join('')
    }</div>` : '';
    render(`<p class="crumb">ת״ש חובה</p>${bar}<h1 class="page-title" id="ttl">${esc(t.title)}</h1>${updLine(t)}<div id="sumwrap">${sumBox(t)}</div><div class="content" id="content">${t.html}</div>${docLink(t.doc)}`, true);
    makeChecklists(document.getElementById('content'), 'chk:' + i);
    if(!langs.length) return;
    const show = l => {
      const c = document.getElementById('content'), h = document.getElementById('ttl');
      const tr = l !== 'he' && t.langs[l];
      c.innerHTML = tr ? tr.html : t.html;
      h.textContent = tr ? tr.title : t.title;
      [c, h].forEach(el => { el.dir = tr ? 'ltr' : 'rtl'; el.lang = l; });
      if(!tr) makeChecklists(c, 'chk:' + i);
      const sw = document.getElementById('sumwrap'); if(sw) sw.hidden = !!tr;
      document.querySelectorAll('.langs button').forEach(b => b.setAttribute('aria-pressed', b.dataset.l === l));
      store.set('lang', l);
    };
    document.querySelector('.langs').addEventListener('click', e => { const b = e.target.closest('button'); if(b) show(b.dataset.l); });
    const saved = store.get('lang');
    show(saved && (saved === 'he' || t.langs[saved]) ? saved : 'he');
  }
  const LANG_NAMES = {en:'English', ru:'Русский', fr:'Français', es:'Español'};

  // כל רשימה תחת "אישורים נדרשים" הופכת לרשימה עם סימון
  function makeChecklists(root, key){
    const saved = store.get(key) || {};
    let n = 0;
    root.querySelectorAll('h3').forEach(h => {
      if(!/^אישורים נדרשים/.test(h.textContent.trim())) return;
      const ol = h.nextElementSibling;
      if(!ol || ol.tagName !== 'OL') return;
      const id = n++;
      const items = [...ol.children].map(li => li.innerHTML);
      const box = document.createElement('div');
      box.className = 'check';
      box.innerHTML = `<div class="check-head"><span>מה כבר יש לך</span><span class="ch-end"><span class="count"></span><button type="button" class="clear" hidden>ניקוי</button></span></div><div class="bar-p"><i></i></div><ul>${
        items.map((it,j)=>`<li><label><input type="checkbox" data-j="${j}" ${saved[id+'.'+j]?'checked':''}><span>${it}</span></label></li>`).join('')
      }</ul>`;
      ol.replaceWith(box);
      const upd = () => {
        const all = box.querySelectorAll('input'), done = box.querySelectorAll('input:checked').length;
        box.querySelector('.count').textContent = done + ' מתוך ' + all.length;
        box.querySelector('.bar-p i').style.width = (done / all.length * 100) + '%';
        box.querySelector('.clear').hidden = !done;
      };
      box.querySelector('.clear').addEventListener('click', () => {
        if(!confirm('לנקות את הסימונים ברשימה הזו?')) return;
        const s = store.get(key) || {};
        box.querySelectorAll('input').forEach(inp => { inp.checked = false; delete s[id+'.'+inp.dataset.j]; });
        store.set(key, s); upd();
      });
      box.addEventListener('change', e => {
        const s = store.get(key) || {};
        s[id+'.'+e.target.dataset.j] = e.target.checked;
        store.set(key, s); store.set('lastChk', key); upd();
      });
      upd();
    });
  }

  /* ---------- בנקים ---------- */
  function bankList(){
    render(`
      <p class="crumb">אישורים לפי בנק</p>
      <h1 class="page-title">באיזה בנק החשבון שלך?</h1>
      <div class="grid">
        ${D.banks.map((b,i)=>`<a class="tile" href="#/banks/${i}">${esc(b.name)}</a>`).join('')}
      </div>
      <div class="note">לכל בנק יש הסבר איך מוציאים ארבעה מסמכים: אישור בעלות חשבון, עובר ושב, פירוט כרטיס אשראי וריכוז יתרות.</div>
    `, true);

  function bank(i){
    let b = D.banks[i]; if(!b) return go('#/banks');
    let alias = '';
    if(b.sameAs){
      const base = D.banks.find(x => x.name === b.sameAs);
      alias = `<div class="alias">${esc(b.name)} שייך לקבוצת הבינלאומי ומשתמש באותה מערכת. ההוראות כאן זהות.</div>`;

    let dev = store.get('device') === 'phone' ? 'phone' : 'pc';
    const draw = () => {
      const docs = b[dev];
      document.getElementById('docs').innerHTML = docs.map((d,k)=>`
        <details class="doc" ${k===0?'open':''}>
          <summary>${esc(d.doc)}<span class="n">${d.steps.length} שלבים</span>${chev}</summary>
          <ol class="steps">${d.steps.map(s=>`<li>${esc(s)}</li>`).join('')}</ol>

  }

  /* ---------- קבע ---------- */
  const extIcon = '<svg class="chev" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><path d="M15 9l-6 6M10 9h5v5"/><path d="M19 13v5a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V7a2 2 0 0 1 2-2h5"/></svg>';
  function keva(){
    render(`
      <p class="crumb">ת״ש קבע</p>
      <h1 class="page-title">הזכויות שלך בקבע</h1>
      ${(D.keva.groups || ['']).map(g => {
        const rows = D.keva.topics.map((t,i)=>({t,i})).filter(x => !g || x.t.group === g);
        return `${g ? `<p class="section-label grp">${esc(g)}</p>` : ''}<ul class="list">${rows.map(({t,i})=>`<li><a class="row" href="#/keva/${i}"><span class="t"><b>${esc(t.title)}</b><span>${esc(t.sub)}</span></span>${chev}</a></li>`).join('')}</ul>`;
      }).join('')}
      <h2 class="sub-title" id="online">בקשות בדיגיטל</h2>
      <ol class="how">
        <li>לחצו על הבקשה הרלוונטית</li>
        <li>עיינו בפירוט הבקשה</li>

        <li>המתינו לתשובה במייל האזרחי</li>

    `, true);

  function kevaTopic(i){

  }

  /* ---------- חגים ומועדים ---------- */
  const MONTHS = ['ינואר','פברואר','מרץ','אפריל','מאי','יוני','יולי','אוגוסט','ספטמבר','אוקטובר','נובמבר','דצמבר'];
  const MON = ['ינו׳','פבר׳','מרץ','אפר׳','מאי','יוני','יולי','אוג׳','ספט׳','אוק׳','נוב׳','דצמ׳'];
  const parseD = s => { const [y,m,d] = s.split('-').map(Number); return new Date(y, m-1, d); };
  function dateLabel(range){
    const [a,b] = range.split('/').map(parseD);
    if(!b) return a.getDate() + ' ב' + MONTHS[a.getMonth()];
    if(a.getMonth() === b.getMonth()) return a.getDate() + '–' + b.getDate() + ' ב' + MONTHS[a.getMonth()];
    return a.getDate() + ' ב' + MONTHS[a.getMonth()] + ' – ' + b.getDate() + ' ב' + MONTHS[b.getMonth()] + (a.getFullYear() !== b.getFullYear() ? ' ' + b.getFullYear() : '');
  }
  const TONE = {S:'ok', A:'take', K:'take', H:'half', F:'fast', N:'fast'};
  function holidays(cid){
    const H = D.holidays;
    const com = H.communities.find(c => c.id === cid) || H.communities.find(c => c.id === store.get('community')) || H.communities[0];
    store.set('community', com.id);
    let svc = store.get('svc') === 'keva' ? 'keva' : 'hova';
    const today = new Date(); today.setHours(0,0,0,0);
    const draw = () => {
      const items = com.items.slice().sort((x,y) => x.date.localeCompare(y.date));
      const next = items.find(it => parseD(it.date.split('/').pop()) >= today);
      let html = '', month = '';
      if(next){
        const c = next[svc];
        html += `<div class="h-next"><span class="h-next-l">החג הבא</span><b>${esc(next.name)}</b><span>${dateLabel(next.date)} · יום ${next.day}</span><span class="tag ${TONE[c]}">${esc(H.codes[c])}</span></div>`;
      }
      items.forEach(it => {
        const a = parseD(it.date.split('/')[0]);
        const mk = MONTHS[a.getMonth()] + ' ' + a.getFullYear();
        if(mk !== month){ month = mk; html += `<p class="h-month">${mk}</p>`; }
        const c = it[svc];
        const past = parseD(it.date.split('/').pop()) < today;
        html += `<div class="h-row${past ? ' past' : ''}${it === next ? ' is-next' : ''}">
          <span class="h-day"><b>${a.getDate()}</b><span>${MON[a.getMonth()]}</span></span>
          <span class="h-t"><b>${esc(it.name)}</b><span>${dateLabel(it.date)} · יום ${it.day}</span><span class="tag ${TONE[c]}">${esc(H.codes[c])}</span></span>
        </div>`;
      });
      document.getElementById('hlist').innerHTML = html;
      document.querySelectorAll('#svc button').forEach(b => b.setAttribute('aria-pressed', b.dataset.s === svc));
    };
    render(`
      <p class="crumb">חגים ומועדים</p>
      <h1 class="page-title">חגים ומועדים ${H.year}</h1>
      <div class="langs h-tabs" role="tablist" aria-label="עדה">${H.communities.map(c => `<a href="#/holidays/${c.id}" role="tab" aria-selected="${c === com}" aria-pressed="${c === com}">${esc(c.name)}</a>`).join('')}</div>
      <div class="seg" id="svc" role="group" aria-label="סוג שירות"><button type="button" data-s="hova">חובה</button><button type="button" data-s="keva">קבע, חב״ק ומת״ק</button></div>
      ${com.note ? `<p class="callout h-note">${esc(com.note)}</p>` : ''}
      <div id="hlist"></div>
      ${docLink(H.doc)}
      <details class="doc h-rules"><summary>כללים חשובים${chev}</summary><div class="content">${H.rules}</div></details>
    `, true);
    document.getElementById('svc').addEventListener('click', e => { const b = e.target.closest('button'); if(!b) return; svc = b.dataset.s; store.set('svc', svc); draw(); });
    draw();
  }

  function sumBox(t){
    const x = t.sum; if(!x) return '';
    const row = (k, v) => `<div class="sm-row"><dt>${k}</dt><dd>${esc(v)}</dd></div>`;
    return `<dl class="summary">${row('מי זכאי', x.who)}${row('מה מקבלים', x.what)}${row('מה צריך', x.need)}${row('איך מבקשים', x.how)}</dl>`;
  }
  function updLine(t){
    let u = t.updated;
    if(!u && t.doc){ const k = [].concat(t.doc)[0]; const doc = D.docs && D.docs[k]; if(doc) u = doc.date + ' · לפי המדיניות'; }
    return u ? `<p class="upd">עודכן: ${esc(u)}</p>` : '';
  }
  /* ---------- מסמכי מדיניות מלאים ---------- */
  const docIcon = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M14 3H7a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2V8z"/><path d="M14 3v5h5M9 13h6M9 17h6"/></svg>';
  const docRow = (slug, label) => { const doc = D.docs[slug]; return `<li><a class="row" href="#/doc/${slug}"><span class="ico">${docIcon}</span><span class="t"><b>${esc(label || doc.title)}</b><span>${label ? esc(doc.title) + ' · ' : ''}${esc(doc.date)} · ${doc.pages} עמודים</span></span>${chev}</a></li>`; };
  function docLink(slugs){
    const list = [].concat(slugs || []).filter(x => D.docs && D.docs[x]); if(!list.length) return '';
    return `<ul class="list doc-link">${list.map(x => docRow(x, list.length === 1 ? 'למדיניות המלאה' : '')).join('')}</ul>`;
  }
  function docsAll(){
    const groups = {};
    Object.keys(D.docs).forEach(k => { const g = D.docs[k].group || 'קבע'; (groups[g] = groups[g] || []).push(k); });
    render(`
      <p class="crumb">מסמכי מדיניות</p>
      <h1 class="page-title">כל מסמכי המדיניות</h1>
      <p class="doc-note">המסמכים המלאים, עם שמות, חתימות ופרטי קשר מושחרים</p>
      ${Object.keys(groups).map(g => `<h2 class="sub-title">${esc(g)}</h2><ul class="list">${groups[g].map(k => docRow(k)).join('')}</ul>`).join('')}
    `, true);
  }
  function docView(slug){
    const doc = D.docs && D.docs[slug]; if(!doc) return go('#/');
    const pages = Array.from({length: doc.pages}, (_, i) => `assets/docs/${slug}-${String(i + 1).padStart(2, '0')}.jpg`);
    render(`
      <p class="crumb">מדיניות מלאה · ${esc(doc.date)}</p>
      <h1 class="page-title">${esc(doc.title)}</h1>
      <p class="doc-note">שמות, חתימות ופרטי קשר הושחרו. לחצו על עמוד כדי להגדיל אותו</p>
      <div class="pages">${pages.map((src, i) => `<a href="${src}" target="_blank" rel="noopener"><img src="${src}" alt="עמוד ${i + 1} מתוך ${doc.pages}" loading="lazy" width="910" height="1287"></a>`).join('')}</div>
    `, true);
  }

  /* ---------- ניתוב ---------- */
  function go(h){ location.hash = h; }
  function route(){
    const p = (location.hash.replace(/^#\/?/, '') || '').split('/');
    if(p[0] === 'hova') return p[1] != null ? hovaTopic(+p[1]) : hovaList();
    if(p[0] === 'banks') return p[1] != null ? bank(+p[1]) : bankList();
    if(p[0] === 'keva') return p[1] != null ? kevaTopic(+p[1]) : keva();
    if(p[0] === 'holidays') return holidays(p[1]);
    if(p[0] === 'doc') return docView(p[1]);
    if(p[0] === 'docs') return docsAll();
    home();
  }
  back.addEventListener('click', () => {
    const p = location.hash.replace(/^#\/?/, '').split('/');
    go(p.length > 1 ? '#/' + p[0] : '#/');
  });
  window.addEventListener('hashchange', route);
  route();
})();
</script>
</body>
</html>
